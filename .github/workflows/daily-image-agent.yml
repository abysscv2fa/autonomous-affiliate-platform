name: Daily AI Image Agent

on:
  schedule:
    # 18:30 Vietnam time = 11:30 UTC; one hour before Facebook publishing.
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-image-agent
  cancel-in-progress: false

jobs:
  generate-daily-image:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Generate and store one campaign image
        env:
          AUTOPILOT_API_URL: https://affiliate-backend-yfy6.onrender.com
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTOPILOT_TOKEN}" ]]; then
            echo "::error::Repository secret AUTOPILOT_TOKEN is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 20 --max-time 600 \
            -X POST "${AUTOPILOT_API_URL}/api/media/generate-daily" \
            -H "X-Autopilot-Token: ${AUTOPILOT_TOKEN}" \
            -H "Content-Type: application/json"
