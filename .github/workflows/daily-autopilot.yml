name: Daily Facebook Autopilot

on:
  schedule:
    # 19:30 Vietnam time = 12:30 UTC.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-facebook-autopilot
  cancel-in-progress: false

jobs:
  publish-daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish one scheduled Facebook post
        env:
          AUTOPILOT_API_URL: https://affiliate-backend-yfy6.onrender.com
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTOPILOT_TOKEN}" ]]; then
            echo "::error::Repository secret AUTOPILOT_TOKEN is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 20 --max-time 240 \
            -X POST "${AUTOPILOT_API_URL}/api/autopilot/scheduled" \
            -H "X-Autopilot-Token: ${AUTOPILOT_TOKEN}" \
            -H "Content-Type: application/json"
      - name: Publish next eligible post to Threads
        env:
          AUTOPILOT_API_URL: https://affiliate-backend-yfy6.onrender.com
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 20 --max-time 180 \
            -X POST "${AUTOPILOT_API_URL}/api/autopilot/publish-threads" \
            -H "X-Autopilot-Token: ${AUTOPILOT_TOKEN}" \
            -H "Content-Type: application/json"
