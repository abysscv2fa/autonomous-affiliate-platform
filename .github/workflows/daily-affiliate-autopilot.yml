name: Daily Affiliate Autopilot

on:
  # Manual-only until the GitHub AUTOPILOT_TOKEN secret is synchronized
  # with the backend AUTOPILOT_TOKEN. Re-enable the daily schedule afterwards.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-daily-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake backend
        env:
          API_URL: https://autonomous-affiliate-platform.onrender.com
        run: |
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 30 "$API_URL/health" >/dev/null; then
              echo "AffPilot backend is responding."
              exit 0
            fi
            echo "Waiting for the free backend to wake up (${attempt}/12)..."
            sleep 10
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Generate daily drafts for human review
        env:
          API_URL: https://autonomous-affiliate-platform.onrender.com
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        run: |
          test -n "$AUTOPILOT_TOKEN" || (echo "Missing AUTOPILOT_TOKEN repository secret" && exit 1)
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 240 \
            -X POST "$API_URL/api/autopilot/scheduled" \
            -H "X-Autopilot-Token: $AUTOPILOT_TOKEN" \
            -H "Content-Type: application/json"
