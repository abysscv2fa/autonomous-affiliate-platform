name: Daily affiliate autopilot

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-daily-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Generate daily content and schedule publishing
        env:
          API_URL: ${{ secrets.AFFILIATE_API_URL }}
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        run: |
          test -n "$API_URL" || (echo "Missing AFFILIATE_API_URL secret" && exit 1)
          test -n "$AUTOPILOT_TOKEN" || (echo "Missing AUTOPILOT_TOKEN secret" && exit 1)
          curl --fail-with-body --silent --show-error \
            -X POST "$API_URL/api/autopilot/scheduled" \
            -H "X-Autopilot-Token: $AUTOPILOT_TOKEN" \
            -H "Content-Type: application/json"
